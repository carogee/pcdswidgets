[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=83", "setuptools_scm[toml]>=6.2" ]

[project]
classifiers = [ "Development Status :: 5 - Production/Stable", "Natural Language :: English", "Programming Language :: Python :: 3",]
description = "LCLS PyDM Widget Library"
dynamic = [ "version", "readme" ]
keywords = []
name = "pcdswidgets"
requires-python = ">=3.12"
dependencies = [
    "pydm>=1.9.0",
    "pyyaml>=6.0.3",
    "qtpy>=2.4.3",
]

[[project.authors]]
name = "SLAC National Accelerator Laboratory"

[options]
zip_safe = false
include_package_data = true

[project.license]
file = "LICENSE.md"

[project.scripts]
pcdswidgets-show = "pcdswidgets.show_screen:main"

[tool.setuptools_scm]
write_to = "pcdswidgets/_version.py"

[project.entry-points."pydm.widget"]
AcquisitionControlFull = "pcdswidgets.imaging.common.acquisition_control_full:AcquisitionControlFull"
ApertureValve = "pcdswidgets.vacuum.valves:ApertureValve"
CameraViewerStretch = "pcdswidgets.imaging.common.camera_viewer_stretch:CameraViewerStretch"
CapacitanceManometerGauge = "pcdswidgets.vacuum.gauges:CapacitanceManometerGauge"
CentroidTrackerFull = "pcdswidgets.imaging.common.centroid_tracker_full:CentroidTrackerFull"
ColdCathodeComboGauge = "pcdswidgets.vacuum.gauges:ColdCathodeComboGauge"
ColdCathodeGauge = "pcdswidgets.vacuum.gauges:ColdCathodeGauge"
ColormapIntesityControlFull = "pcdswidgets.imaging.common.colormap_intesity_control_full:ColormapIntesityControlFull"
ControlOnlyValveNC = "pcdswidgets.vacuum.valves:ControlOnlyValveNC"
ControlOnlyValveNO = "pcdswidgets.vacuum.valves:ControlOnlyValveNO"
ControlValve = "pcdswidgets.vacuum.valves:ControlValve"
EPSByteIndicator = "pcdswidgets.eps_byteindicator:EPSByteIndicator"
EpicsRoiFull = "pcdswidgets.imaging.common.epics_roi_full:EpicsRoiFull"
ExposureTimingControlFull = "pcdswidgets.imaging.common.exposure_timing_control_full:ExposureTimingControlFull"
FastShutter = "pcdswidgets.vacuum.valves:FastShutter"
FeatureFinder = "pcdswidgets.common.tools.feature_finder:FeatureFinder"
FilterSortWidgetTable = "pcdswidgets.table:FilterSortWidgetTable"
GetterPump = "pcdswidgets.vacuum.pumps:GetterPump"
HotCathodeComboGauge = "pcdswidgets.vacuum.gauges:HotCathodeComboGauge"
HotCathodeGauge = "pcdswidgets.vacuum.gauges:HotCathodeGauge"
IndicatorGrid = "pcdswidgets.common.dock.indicator_grid:IndicatorGrid"
IonPump = "pcdswidgets.vacuum.pumps:IonPump"
IonPumpNoIlk = "pcdswidgets.vacuum.pumps:IonPumpNoIlk"
MarkerSelectionFull = "pcdswidgets.imaging.common.marker_selection_full:MarkerSelectionFull"
MotorBeckhoffSlits = "pcdswidgets.motion.common.motor_beckhoff_slits:MotorBeckhoffSlits"
MotorClassicFull = "pcdswidgets.motion.common.motor_classic_full:MotorClassicFull"
MotorClassicRow = "pcdswidgets.motion.common.motor_classic_row:MotorClassicRow"
MotorClassicVert = "pcdswidgets.motion.common.motor_classic_vert:MotorClassicVert"
MotorExpertScreenBeckhoff = "pcdswidgets.motion.expert.motor_expert_screen_beckhoff:MotorExpertScreenBeckhoff"
MotorStateMover = "pcdswidgets.motion.common.motor_state_mover:MotorStateMover"
MotorStateMoverExpanded = "pcdswidgets.motion.common.motor_state_mover_expanded:MotorStateMoverExpanded"
MotorStateMoverExpandedPMPS = "pcdswidgets.motion.common.motor_state_mover_expanded:MotorStateMoverExpandedPMPS"
MotorTcClassicRow = "pcdswidgets.motion.common.motor_tc_classic_row:MotorTcClassicRow"
MotorTipTiltDouble = "pcdswidgets.motion.common.motor_tip_tilt_double:MotorTipTiltDouble"
MotorTipTiltFull = "pcdswidgets.motion.common.motor_tip_tilt_full:MotorTipTiltFull"
NeedleValve = "pcdswidgets.vacuum.valves:NeedleValve"
PneumaticValve = "pcdswidgets.vacuum.valves:PneumaticValve"
PneumaticValveDA = "pcdswidgets.vacuum.valves:PneumaticValveDA"
PneumaticValveNO = "pcdswidgets.vacuum.valves:PneumaticValveNO"
ProportionalValve = "pcdswidgets.vacuum.valves:ProportionalValve"
RGA = "pcdswidgets.vacuum.others:RGA"
RightAngleManualValve = "pcdswidgets.vacuum.valves:RightAngleManualValve"
RoughGauge = "pcdswidgets.vacuum.gauges:RoughGauge"
ScrollPump = "pcdswidgets.vacuum.pumps:ScrollPump"
SmaractOpenLoopClassicRow = "pcdswidgets.motion.smaract.smaract_open_loop_classic_row:SmaractOpenLoopClassicRow"
SmaractOpenLoopContextDouble = "pcdswidgets.motion.smaract.smaract_open_loop_context_double:SmaractOpenLoopContextDouble"
SvgMultiStateLED = "pcdswidgets.motion.common.svg_multi_state_led:SvgMultiStateLED"
TabDock = "pcdswidgets.common.dock.tab_dock:TabDock"
TabDockButton = "pcdswidgets.common.dock.tab_dock_button:TabDockButton"
TabDockDiagramButton = "pcdswidgets.common.dock.tab_dock_diagram_button:TabDockDiagramButton"
TurboPump = "pcdswidgets.vacuum.pumps:TurboPump"
ViewSaver = "pcdswidgets.common.tools.view_saver.view_saver:ViewSaver"
YamlToolbar = "pcdswidgets.common.toolbar.yaml_toolbar:YamlToolbar"

[project.optional-dependencies]
dev = [
    "jinja2>=3",
    "ruff>=0.15.8",
    "tomlkit>=0.14.0",
]
doc = [
    "docs-versions-menu>=0.5.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-jquery>=4.1",
]
test = [
    "jinja2>=3",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "tomlkit>=0.14.0",
]
typhos = [
    "happi>=3.0.1",
    "typhos>=4.3.0",
]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "pcdswidgets*",]
namespaces = false

[tool.setuptools.dynamic.readme]
file = "README.md"
content-type = "text/markdown"

[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", "build", "dist", "*/_version.py"]

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright.defineConstant]
PYQT5 = true
PYSIDE2 = false
PYQT6 = false
PYSIDE6 = false

[tool.uv]
exclude-newer = "7 days"
