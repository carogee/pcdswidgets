# Example AlarmGrid configuration reproducing the beamline status-overview
# screenshot.  Columns are locations; rows are device categories grouped under
# bold section headers.
#
# Each device entry needs a `name` and a `channel` (any PV whose alarm severity
# reflects device health).  Optionally add `detail` (a PyDM .ui screen, relative
# to this file) and `macros` to open a per-device screen on click.
#
# This example uses `loc://` local channels so it can be launched without a live
# IOC.  Swap these for real `ca://...` PVs in production, and verify the PV
# suffixes with `caget` -- do not trust the ophyd/pcdsdevices class.

columns: [EBD, FEE]

rows:
  - section: OPTICS SYSTEM
  - category: Mirrors
    cells:
      FEE:
        # A device may watch several PVs via `channels`; its status is the worst
        # across all of them, shown as ONE combined menu entry.  The `typhos`
        # key opens that happi device's Typhos screen on click (needs happi +
        # typhos at runtime; the live status via ca:// works regardless).
        - name: MR1K1
          channels:
            - "ca://MR1K1:BEND:MMS:PITCH"
            - "ca://MR1K1:BEND:MMS:US"
            - "ca://MR1K1:BEND:MMS:DS"
            - "ca://MR1K1:BEND:MMS:YUP"
            - "ca://MR1K1:BEND:MMS:YDWN"
            - "ca://MR1K1:BEND:MMS:XUP"
            - "ca://MR1K1:BEND:MMS:XDWN"
          typhos: mr1k1_bend
        - name: MR1K2
          channels:
            - "ca://MR1K2:SWITCH:MMS:PITCH"
            - "ca://MR1K2:SWITCH:MMS:YLEFT"
            - "ca://MR1K2:SWITCH:MMS:YRIGHT"
            - "ca://MR1K2:SWITCH:MMS:XUP"
            - "ca://MR1K2:SWITCH:MMS:XDWN"
          typhos: mr1k2_switch
  - category: Slits
    cells:
      # SL1K0/SL2K0 are PowerSlits with four blade motors and no device-level
      # summary PV, so each lists its four blades and shows as ONE combined
      # entry whose color aggregates TOP/BOTTOM/NORTH/SOUTH.  `detail` opens the
      # macro-driven slit.ui; `macros` fills its ${prefix} placeholder.
      EBD:
        - name: SL1K0
          channels:
            - "ca://SL1K0:POWER:MMS:TOP"
            - "ca://SL1K0:POWER:MMS:BOTTOM"
            - "ca://SL1K0:POWER:MMS:NORTH"
            - "ca://SL1K0:POWER:MMS:SOUTH"
          detail: "slit.ui"
          macros: {prefix: "SL1K0:POWER"}
      FEE:
        - name: SL2K0
          channels:
            - "ca://SL2K0:POWER:MMS:TOP"
            - "ca://SL2K0:POWER:MMS:BOTTOM"
            - "ca://SL2K0:POWER:MMS:NORTH"
            - "ca://SL2K0:POWER:MMS:SOUTH"
          detail: "slit.ui"
          macros: {prefix: "SL2K0:POWER"}
  - category: Attenuators
    cells:
      FEE:
        - {name: AT1L0, channel: "loc://at1l0?type=int&init=0"}
  - category: Photon Collimator
    cells: {}

  - section: BEAM ENERGY
  - category: Gas ATT
    cells:
      FEE:
        - {name: GATT, channel: "loc://gatt?type=int&init=0"}
  - category: GMD
    cells:
      EBD:
        - {name: GMD, channel: "loc://gmd?type=int&init=1"}
  - category: XGMD
    cells:
      FEE:
        - {name: XGMD, channel: "loc://xgmd?type=int&init=0"}
  - category: Beam stopper
    cells:
      EBD:
        - {name: STOPPER, channel: "loc://stopper?type=int&init=0"}

  # NOTE: the new rows below are placeholders -- columns default to EBD; move an
  # entry under `FEE:` to change its column.  Swap the loc:// channels for real
  # ca:// PVs when available.
  - section: BEAM IMAGING
  - category: Diodes
    cells: {}
  - category: Imagers
    cells:
      EBD:
        - name: IM1K0_detector
          channels:
            - "loc://im1k0_target?type=int&init=0"
            - "loc://im1k0_motor?type=int&init=0"
        - name: IM2K0_detector
          channels:
            - "loc://im2k0_target?type=int&init=0"
            - "loc://im2k0_motor?type=int&init=0"
  - category: Wavefront Sensors
    cells:
      EBD:
        - name: PF1K0
          channels:
            - "loc://pf1k0_target?type=int&init=0"
            - "loc://pf1k0_y_motor?type=int&init=0"
            - "loc://pf1k0_z_motor?type=int&init=0"
            - "loc://pf1k0_thermocouple1?type=int&init=0"
            - "loc://pf1k0_thermocouple2?type=int&init=0"
            - "loc://pf1k0_flow_switch?type=int&init=0"

  - section: BEAMLINE
  - category: TV1L0
    cells: {}

  - section: ENVIRONMENT
  - category: Sensors
    cells:
      EBD:
        - {name: ENV1, channel: "loc://env1?type=int&init=0"}
      FEE:
        - {name: ENV2, channel: "loc://env2?type=int&init=0"}
  - category: RTDS
    cells:
      EBD:
        - {name: rtdsk0_mpa1, channel: "loc://rtdsk0_mpa1?type=int&init=0"}
        - {name: rtdsk0_mpa2, channel: "loc://rtdsk0_mpa2?type=int&init=0"}
        # Rtdsx01_mms{x,y,z} are motion devices.
        - {name: Rtdsx01_mmsx, channel: "loc://rtdsx01_mmsx?type=int&init=0"}
        - {name: Rtdsx01_mmsy, channel: "loc://rtdsx01_mmsy?type=int&init=0"}
        - {name: Rtdsx01_mmsz, channel: "loc://rtdsx01_mmsz?type=int&init=0"}

  - section: TIMING SYSTEM
  - category: TPRs/EVRs
    cells: {}

  - section: INFRASTRUCTURE
  - category: Servers
    cells: {}
  - category: PDUs
    cells: {}
  - category: Rad monitoring
    cells: {}
